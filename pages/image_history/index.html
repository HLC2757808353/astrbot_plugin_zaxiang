<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>AI 生成图片</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #8a919f;
    --border: #e4e7ed;
    --accent: #3b82f6;
    --danger: #ef4444;
    --radius: 10px;
  }
  [data-theme="dark"] {
    --bg: #15171c;
    --card: #1e2128;
    --text: #e6e8ec;
    --muted: #9aa1ad;
    --border: #2c303a;
    --accent: #60a5fa;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .stats { font-size: 13px; color: var(--muted); }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #000;
    cursor: zoom-in; display: block;
  }
  .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .badge {
    align-self: flex-start; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: rgba(59, 130, 246, 0.12); color: var(--accent); font-weight: 500;
  }
  .prompt {
    font-size: 13px; line-height: 1.5; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .meta { font-size: 12px; color: var(--muted); }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .link { font-size: 12px; color: var(--accent); text-decoration: none; }
  .link:hover { text-decoration: underline; }
  .del {
    font-size: 12px; color: var(--danger); background: none; border: none;
    cursor: pointer; padding: 2px 4px;
  }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.82); display: none;
    align-items: center; justify-content: center; z-index: 100; cursor: zoom-out;
  }
  .lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 6px; }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .btn:hover { opacity: 0.9; }
  .loading { text-align: center; color: var(--muted); padding: 40px; font-size: 14px; }
</style>
</head>
<body>
  <div class="header">
    <h1>AI 生成图片</h1>
    <div class="toolbar">
      <span class="stats" id="stats"></span>
      <button class="btn" id="refresh">刷新</button>
    </div>
  </div>
  <div id="loading" class="loading">加载中…</div>
  <div id="empty" class="empty" style="display:none">还没有生成过图片</div>
  <div class="grid" id="grid"></div>

  <div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script>
(function () {
  var API_BASE = '/api/plugins/extensions/zaxiang_image_history';
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var loading = document.getElementById('loading');
  var stats = document.getElementById('stats');
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightbox-img');

  function fmt(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function render(list) {
    loading.style.display = 'none';
    if (!list || !list.length) {
      empty.style.display = 'block';
      stats.textContent = '共 0 张';
      return;
    }
    empty.style.display = 'none';
    stats.textContent = '共 ' + list.length + ' 张';
    grid.innerHTML = '';
    list.forEach(function (r) {
      var card = document.createElement('div');
      card.className = 'card';
      var modeLabel = r.mode === 'i2i' ? '图生图' : '文生图';
      card.innerHTML =
        '<img class="thumb" src="' + esc(r.file_url) + '" alt="" loading="lazy" data-full="' + esc(r.file_url) + '">' +
        '<div class="body">' +
          '<span class="badge">' + modeLabel + '</span>' +
          '<div class="prompt" title="' + esc(r.prompt) + '">' + esc(r.prompt) + '</div>' +
          '<div class="meta">' + fmt(r.created_at) + ' · ' + esc(r.size || '') + '</div>' +
          '<div class="actions">' +
            '<a class="link" href="' + esc(r.file_url) + '" target="_blank">查看原图</a>' +
            '<button class="del" data-id="' + r.id + '">删除</button>' +
          '</div>' +
        '</div>';
      grid.appendChild(card);
    });
    grid.querySelectorAll('.thumb').forEach(function (img) {
      img.addEventListener('click', function () {
        lightboxImg.src = img.dataset.full;
        lightbox.style.display = 'flex';
      });
    });
    grid.querySelectorAll('.del').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        if (!confirm('确定删除这张生成记录及其文件吗？')) return;
        var id = btn.dataset.id;
        try {
          var res = await fetch(API_BASE + '/delete/' + id, { method: 'DELETE' });
          if (res.ok) { load(); }
          else { alert('删除失败'); }
        } catch (e) { alert('删除失败：' + e); }
      });
    });
  }

  async function load() {
    loading.style.display = 'block';
    try {
      var res = await fetch(API_BASE + '/list');
      var data = await res.json();
      render(data);
    } catch (e) {
      loading.style.display = 'none';
      empty.style.display = 'block';
      empty.textContent = '加载失败：' + e;
    }
  }

  lightbox.addEventListener('click', function () {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
  });
  document.getElementById('refresh').addEventListener('click', load);

  load();
})();
</script>
</body>
</html>
